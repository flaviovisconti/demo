<style>
/* ---------- Temi ---------- */
:root {
  --banner-h: 44px;

  --maxw: 72rem;
  --wa: #1d7a43; --wa-hover: #145c31;

}
[data-tema="elegante"] {

}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--banner-h) + var(--header-h) + 8px); -webkit-text-size-adjust: 100%; }

}
img { display: block; max-width: 100%; height: auto; }
a { color: inherit; }
h1, h2, h3 {

}

/* Elegante: foto a tutto schermo, testo in basso a sinistra */
[data-tema="elegante"] .hero { min-height: max(34rem, calc(100svh - var(--banner-h) - var(--header-h))); display: grid; color: var(--on-dark); background: var(--dark); }

/* Moderno: blocco diviso con foto a destra */
[data-tema="moderno"] .hero { background: var(--surface); border-bottom: 1px solid var(--line); }

[data-tema="naturale"] .hero__inner { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2.75rem; align-items: center; }

/* ---------- Chi siamo ---------- */
.about__grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(2.5rem, 6vw, 5rem); align-items: center; }
.about__media { position: relative; max-width: 28rem; }

.about__text { display: grid; gap: 1.5rem; }
.about__text h2 { font-size: clamp(2.3rem, 6vw, 3.75rem); }
.about__text .lead { color: var(--ink); max-width: 36rem; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 1.25rem 2rem; margin: .5rem 0 0; padding-top: 1.5rem; border-top: 1px solid var(--line); }

[data-tema="elegante"] .about__media { margin-right: 1.25rem; }
[data-tema="elegante"] .about { position: relative; isolation: isolate; }

[data-tema="moderno"] .about__media::before { content: ""; position: absolute; inset: auto auto -1rem -1rem; width: 55%; height: 55%; background: var(--accent); z-index: -1; border-radius: var(--radius); }
[data-tema="naturale"] .about__media img { border-radius: var(--radius) 160px var(--radius) var(--radius); }

  [data-tema="naturale"] .about__media { margin-right: 1.25rem; }

/* ---------- Categorie di prodotti ---------- */
.products { background: var(--surface); }
[data-tema="moderno"] .products { background: var(--bg); }
.cats { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); gap: 1.25rem; }

.cat__img { overflow: hidden; }

.products-note { margin-top: 1.5rem; font-size: .88rem; color: var(--muted); }

.brands__list li { font-family: var(--font-display); font-weight: var(--display-weight); font-size: clamp(1.3rem, 3vw, 1.8rem); letter-spacing: var(--display-tracking); color: var(--ink); }

.extras { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 14rem), 1fr)); gap: .75rem; }
.extra { display: flex; align-items: center; gap: 1rem; padding: 1.15rem 1.25rem; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); font-weight: 700; }

  var ora = adessoRoma();

  function statoApertura() {
    if (!haFasce || ora.giorno < 0) return null;
    var d = ora.giorno, m = ora.min, ieri = (d + 6) % 7, i, f;
    for (i = 0; i < settimana[d].length; i++) { f = settimana[d][i]; if (m >= f[0] && m < f[1]) return { aperto: true, testo: 'Aperto ora · chiude alle ' + hhmm(f[1]) }; }
    for (i = 0; i < settimana[ieri].length; i++) { f = settimana[ieri][i]; if (f[1] > 1440 && m < f[1] - 1440) return { aperto: true, testo: 'Aperto ora · chiude alle ' + hhmm(f[1]) }; }
    for (var k = 0; k < 7; k++) {
      var g = (d + k) % 7;
      var prossime = settimana[g].filter(function (x) { return k > 0 || x[0] > m; }).sort(function (a, b) { return a[0] - b[0]; });
      if (prossime.length) {
        var quando = k === 0 ? '' : k === 1 ? 'domani ' : GIORNI[g] + ' ';
        var prefisso = settimana[d].length ? 'Chiuso ora' : 'Oggi chiuso';
        return { aperto: false, testo: prefisso + ' · ' + (k === 0 ? 'apre' : 'riapre') + ' ' + quando + 'alle ' + hhmm(prossime[0][0]) };
      }
    }
    return null;
  }
  var stato = statoApertura();
  function badgeStato() {
    if (!stato) return null;
    return h('p', { class: 'status' + (stato.aperto ? ' is-open' : '') }, h('span', { class: 'status__dot', 'aria-hidden': 'true' }), stato.testo);
  }
  var orarioOggi = (orari.filter(function (o) { return o.giorni.indexOf(ora.giorno) > -1; })[0] || {}).orario;

  /* ===== Meta pagina e banner ===== */
  document.title = nome + ' – ' + T.label + (quartiere ? ' a ' + quartiere : '') + ' (anteprima)';
  var cont = document.getElementById('preview-contact');
  cont.href = 'https://wa.me/' + AUTORE_WHATSAPP + '?text=' +
    encodeURIComponent('Ciao Flavio, ho visto l\'anteprima del sito per ' + nome + ' e vorrei saperne di più.');
  cont.target = '_blank'; cont.rel = 'noopener';

  /* ===== Sezioni ===== */
  var app = document.getElementById('app');
  var nav = [];

  // Pulsanti hero: WhatsApp (o telefono) + "Come raggiungerci"
  function azioniHero() {
    var out = [];
    if (wa) out.push(h('a', { class: 'btn btn--wa', href: waLink(msgDisponibilita), target: '_blank', rel: 'noopener' }, icon('chat'), 'Scrivici su WhatsApp'));
    else if (telHref) out.push(h('a', { class: 'btn btn--primary', href: 'tel:' + telHref }, icon('phone'), 'Chiamaci'));
    if (indirizzo) out.push(h('a', { class: 'btn btn--ghost', href: '#dove' }, icon('route'), 'Come raggiungerci'));
    return out;
  }

  // Hero
  var hero = h('section', { class: 'hero', 'aria-labelledby': 'hero-title' },
    h('div', { class: 'wrap hero__inner' },
      h('div', { class: 'hero__content' },
        h('p', { class: 'eyebrow' }, T.label + (quartiere ? ' · ' + quartiere : '')),
        h('h1', { id: 'hero-title' }, nome),
        slogan && h('p', { class: 'hero__slogan' }, slogan),
        h('div', { class: 'hero__actions' }, azioniHero()),
        badgeStato()),
      h('div', { class: 'hero__media' },
        h('picture', null,
          h('source', { media: '(min-width: 760px)', srcset: IMG + 'hero-1600.webp', width: 1600, height: 1000 }),
          h('img', { src: IMG + 'hero-800.webp', width: 800, height: 1000, alt: T.foto[0], fetchpriority: 'high' })))));

  // Chi siamo
  var about = null;
  if (descrizione) {
    nav.push(['chi-siamo', 'Chi siamo']);
    var facts = [];
    if (orarioOggi) facts.push(['Oggi', orarioOggi]);
    if (indirizzo) facts.push(['Dove', indirizzo]);
    else if (quartiere) facts.push(['Zona', quartiere]);
    about = h('section', { class: 'section about', id: 'chi-siamo', 'aria-labelledby': 'about-title' },
      h('div', { class: 'wrap about__grid' },
        h('div', { class: 'about__media reveal' },
          h('img', { src: IMG + 'chi-siamo.webp', width: 900, height: 1100, alt: T.foto[1], loading: 'lazy', decoding: 'async' })),
        h('div', { class: 'about__text reveal' },
          h('p', { class: 'eyebrow' }, 'Chi siamo'),
          h('h2', { id: 'about-title' }, quartiere ? T.luogo + ' a ' + quartiere : T.luogo),
          h('p', { class: 'lead' }, descrizione),
          facts.length && h('dl', { class: 'facts' }, facts.map(function (f) {
            return h('div', null, h('dt', null, f[0]), h('dd', null, f[1]));
          })))));
  }

  // Categorie di prodotti (vetrina: niente prezzi, niente carrello)
  var products = null;
  if (categorie.length) {
    nav.push(['prodotti', 'Prodotti']);
    products = h('section', { class: 'section products', id: 'prodotti', 'aria-labelledby': 'products-title' },
      h('div', { class: 'wrap' },
        h('div', { class: 'sec-head reveal' },
          h('p', { class: 'eyebrow' }, 'In negozio'),
          h('h2', { id: 'products-title' }, 'Cosa trovi da noi'),
          wa && h('p', { class: 'lead' }, 'Cerchi qualcosa in particolare? Scrivici e ti diciamo se è disponibile.')),
        h('ul', { class: 'cats' }, categorie.map(function (c, i) {
          var n = c.immagine || (i % 6) + 1;
          return h('li', { class: 'cat reveal' },
            h('div', { class: 'cat__img' },
              h('img', { src: IMG + 'prodotto-' + n + '.webp', width: 800, height: 600, alt: T.foto[n + 1], loading: 'lazy', decoding: 'async' })),
            h('div', { class: 'cat__body' },
              h('h3', null, c.nome),
              c.descrizione && h('p', null, c.descrizione),
              wa && h('a', { class: 'cat__ask', href: waLink('Ciao ' + nome + ', cerco un prodotto nella categoria «' + c.nome + '»: '), target: '_blank', rel: 'noopener', 'aria-label': 'Chiedi disponibilità per ' + c.nome + ' su WhatsApp' },
                'Chiedi disponibilità', icon('arrow'))));
        })),
        h('p', { class: 'products-note' }, 'Immagini di repertorio a scopo illustrativo.')));
  }

  // Marchi: solo i nomi, come testo
  var brands = null;
  if (marchi.length) {
    brands = h('section', { class: 'brands', 'aria-labelledby': 'brands-title' },
      h('div', { class: 'wrap' },
        h('p', { class: 'eyebrow', id: 'brands-title' }, 'Marchi disponibili'),
        h('ul', { class: 'brands__list' }, marchi.map(function (m) { return h('li', null, m); }))));
  }

  // Servizi extra
  var extraSec = null;
  if (extra.length) {
    nav.push(['servizi', 'Servizi']);
    extraSec = h('section', { class: 'section extras-sec', id: 'servizi', 'aria-labelledby': 'extras-title' },
      h('div', { class: 'wrap' },
        h('div', { class: 'sec-head reveal' },
          h('p', { class: 'eyebrow' }, 'Comodità'),
          h('h2', { id: 'extras-title' }, 'Servizi')),
        h('ul', { class: 'extras' }, extra.map(function (e) {
          var n = norm(e), nomeIcona = 'check';
          for (var i = 0; i < EXTRA_ICONS.length; i++) if (EXTRA_ICONS[i][0].test(n)) { nomeIcona = EXTRA_ICONS[i][1]; break; }
          return h('li', { class: 'extra reveal' }, h('span', { class: 'extra__icon' }, icon(nomeIcona)), maiuscola(e));
        }))));
  }

  // Galleria
  nav.push(['galleria', 'Galleria']);
  var gallery = h('section', { class: 'section gallery-sec', id: 'galleria', 'aria-labelledby': 'gallery-title' },
    h('div', { class: 'wrap' },
      h('div', { class: 'sec-head reveal' },
        h('p', { class: 'eyebrow' }, 'Galleria'),
        h('h2', { id: 'gallery-title' }, 'Uno sguardo')),
      h('ul', { class: 'gallery' }, [1, 2, 3, 4].map(function (i) {
        return h('li', { class: 'reveal' },
          h('img', { src: IMG + 'galleria-' + i + '.webp', width: 900, height: 1100, alt: T.foto[i + 7], loading: 'lazy', decoding: 'async' }));
      })),
      h('p', { class: 'gallery-note' }, 'Immagini di repertorio a scopo illustrativo.')));

  // Orari e mappa
  var visit = null;
  if (orari.length || indirizzo) {
    var blocchi = [];
    if (orari.length) {
      nav.push(['orari', 'Orari']);
      blocchi.push(h('div', { class: 'visit__hours reveal', id: 'orari' },
        h('div', { class: 'sec-head', style: 'margin-bottom:1.25rem' }, h('p', { class: 'eyebrow' }, 'Quando'), h('h2', null, 'Orari di apertura')),
        badgeStato(),
        h('dl', { class: 'hours' }, orari.map(function (o) {
          var oggi = o.giorni.indexOf(ora.giorno) > -1;
          var chiuso = !o.orario || /chius/i.test(o.orario);
          return h('div', { class: 'hours__row' + (oggi ? ' is-today' : '') + (chiuso ? ' is-closed' : '') },
            h('dt', null, o.giorno, oggi && h('span', { class: 'hours__badge' }, 'Oggi')),
            h('dd', null, o.orario || 'Chiuso'));
        }))));
    }
    if (indirizzo) {
      nav.push(['dove', 'Dove siamo']);
      var q = encodeURIComponent(indirizzo);
      blocchi.push(h('div', { class: 'map reveal', id: 'dove' },
        h('div', { class: 'sec-head', style: 'margin-bottom:.75rem' }, h('p', { class: 'eyebrow' }, 'Come raggiungerci'), h('h2', null, 'Dove siamo')),
        h('iframe', { class: 'map__frame', src: 'https://maps.google.com/maps?q=' + q + '&z=16&output=embed', title: 'Mappa: ' + indirizzo, loading: 'lazy', referrerpolicy: 'no-referrer-when-downgrade', allowfullscreen: true }),
        h('div', { class: 'map__address' },
          h('p', null, icon('pin'), indirizzo),
          h('a', { class: 'btn btn--ghost btn--small', href: 'https://www.google.com/maps/dir/?api=1&destination=' + q, target: '_blank', rel: 'noopener' }, 'Indicazioni stradali', icon('ext')))));
    }
    visit = h('section', { class: 'section visit', 'aria-label': 'Orari e posizione' },
      h('div', { class: 'wrap visit__grid' + (blocchi.length > 1 ? ' has-both' : '') }, blocchi));
  }

  // Contatti (+ social)
  var contatti = [];
  if (wa) contatti.push(['chat', 'WhatsApp', '+' + wa.replace(/^(\d{2})(\d{3})(\d+)/, '$1 $2 $3'), waLink(msgInfo)]);
  if (telefono) contatti.push(['phone', 'Telefono', telefono, telHref && 'tel:' + telHref]);
  if (email) contatti.push(['mail', 'Email', email, 'mailto:' + email]);
  if (indirizzo) contatti.push(['pin', 'Indirizzo', indirizzo, 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(indirizzo)]);
  social.forEach(function (s) { contatti.push([s[0], s[1], socialLabel(s[2]), s[2]]); });

  var contact = null;
  if (contatti.length) {
    nav.push(['contatti', 'Contatti']);
    var azioni = [];
    if (wa) azioni.push(h('a', { class: 'btn btn--wa', href: waLink(msgDisponibilita), target: '_blank', rel: 'noopener' }, icon('chat'), 'Scrivici su WhatsApp'));
    if (telHref) azioni.push(h('a', { class: 'btn btn--ghost', href: 'tel:' + telHref }, icon('phone'), 'Chiama'));
    contact = h('section', { class: 'section contact dark', id: 'contatti', 'aria-labelledby': 'contact-title' },
      h('div', { class: 'wrap contact__grid' },
        h('div', { class: 'reveal' },
          h('p', { class: 'eyebrow' }, 'Contatti'),
          h('h2', { id: 'contact-title' }, 'Passa a trovarci'),
          h('p', { class: 'lead' }, wa ? 'Vuoi sapere se un prodotto è disponibile prima di venire? Scrivici su WhatsApp.' : 'Per qualsiasi informazione, contattaci.'),
          azioni.length && h('div', { class: 'contact__actions' }, azioni)),
        h('ul', { class: 'contact__list reveal' }, contatti.map(function (c) {
          var inner = [icon(c[0]), h('span', null, h('span', { class: 'contact__label' }, c[1]), h('span', { class: 'contact__value' }, c[2]))];
          var ext = c[3] && /^https/.test(c[3]);
          return h('li', null, c[3]
            ? h('a', { class: 'contact__item', href: c[3], target: ext ? '_blank' : null, rel: ext ? 'noopener' : null }, inner)
            : h('div', { class: 'contact__item' }, inner));
        }))));
  }

  // Header
  var headerCta = wa
    ? h('a', { class: 'btn btn--wa btn--small', href: waLink(msgDisponibilita), target: '_blank', rel: 'noopener' }, icon('chat'), 'Scrivici')
    : telHref ? h('a', { class: 'btn btn--primary btn--small', href: 'tel:' + telHref }, icon('phone'), 'Chiama') : null;
  var header = h('header', { class: 'site-header' },
    h('div', { class: 'wrap' },
      h('a', { class: 'brand', href: '#contenuto' }, nome),
      h('nav', { class: 'nav', 'aria-label': 'Sezioni' },
        h('ul', null, nav.map(function (n) { return h('li', null, h('a', { href: '#' + n[0] }, n[1])); }))),
      headerCta));

  // Footer
  var footer = h('footer', { class: 'site-footer dark' },
    h('div', { class: 'wrap' },
      h('div', null, h('strong', null, nome), indirizzo && h('div', null, indirizzo)),
      h('div', null,
        h('div', null, '© ' + new Date().getFullYear() + ' ' + nome),
        h('div', null, 'Anteprima dimostrativa, non è il sito ufficiale dell\'attività.'),
        h('div', null, 'Realizzata da Flavio Visconti · ',
          h('a', { href: 'mailto:' + AUTORE_EMAIL + '?subject=' + encodeURIComponent('Sito per ' + nome) }, AUTORE_EMAIL)))));

  var main = h('main', { id: 'contenuto', tabindex: '-1' }, hero, about, products, brands, extraSec, gallery, visit, contact);
  app.append(header, main, footer);

  /* ===== Altezza del banner (può andare su due righe) ===== */
  var banner = document.getElementById('preview-banner');
  function syncBanner() { root.style.setProperty('--banner-h', banner.offsetHeight + 'px'); }
  syncBanner();
  if ('ResizeObserver' in window) new ResizeObserver(syncBanner).observe(banner);

  /* ===== Animazioni d'ingresso ===== */
  if ('IntersectionObserver' in window && matchMedia('(prefers-reduced-motion: no-preference)').matches) {
    root.classList.add('js-reveal');
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -8% 0px' });
    document.querySelectorAll('.reveal').forEach(function (el) { io.observe(el); });
  }
})();
</script>
</body>
</html>
