<style>
/* ---------- Temi ---------- */
:root {
  --banner-h: 44px;
  --header-h: 64px;
  --maxw: 72rem;
}
[data-tema="elegante"] {
  --bg: #f7f3ee; --surface: #eee6db; --ink: #1d1a17; --muted: #645b52; --line: #d8cdbf;
  --accent: #8a6438; --accent-text: #80592e; --accent-ink: #fff; --accent-on-dark: #cfae84;

  --font-display: "Cormorant Garamond", "Times New Roman", Georgia, serif;
  --font-body: "Jost", system-ui, sans-serif;
  --display-weight: 500; --display-tracking: -0.01em;
  --radius: 0; --btn-radius: 0;
}
[data-tema="moderno"] {
  --bg: #f1f1ec; --surface: #ffffff; --ink: #0f0f0f; --muted: #55554f; --line: #d4d4cc;
  --accent: #ff5a26; --accent-text: #bf360a; --accent-ink: #0f0f0f; --accent-on-dark: #ff6a3a;
  --dark: #0f0f0f; --on-dark: #f1f1ec; --on-dark-muted: #a5a59e;
  --font-display: "Syne", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, sans-serif;
  --display-weight: 800; --display-tracking: -0.035em;
  --radius: 4px; --btn-radius: 4px;
}
[data-tema="naturale"] {
  --bg: #f3eee4; --surface: #e8e0d0; --ink: #2b3127; --muted: #5a6152; --line: #d3c9b6;
  --accent: #9a4f33; --accent-text: #8f4529; --accent-ink: #fbf8f2; --accent-on-dark: #e6a688;
  --sage: #8b9a78;
  --dark: #2e3a2b; --on-dark: #f3eee4; --on-dark-muted: #c2c7b4;
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Figtree", system-ui, sans-serif;
  --display-weight: 400; --display-tracking: -0.02em;
  --radius: 22px; --btn-radius: 999px;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--banner-h) + var(--header-h) + 8px); -webkit-text-size-adjust: 100%; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body {
  margin: 0; padding-top: var(--banner-h);
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 1.0625rem; line-height: 1.65;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
img { display: block; max-width: 100%; height: auto; }
a { color: inherit; }
h1, h2, h3 {
  margin: 0; font-family: var(--font-display); font-weight: var(--display-weight);
  letter-spacing: var(--display-tracking); line-height: 1.02; text-wrap: balance;
}
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.dark :focus-visible, [data-tema="elegante"] .hero :focus-visible, [data-tema="moderno"] .hero :focus-visible { outline-color: var(--on-dark); }
.wrap { width: min(100% - 2rem, var(--maxw)); margin-inline: auto; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.icon { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.section { padding-block: clamp(4.5rem, 11vw, 8.5rem); }
.sec-head { display: grid; gap: .9rem; margin-bottom: clamp(2.25rem, 6vw, 4rem); max-width: 40rem; }

[data-tema="elegante"] .btn { text-transform: uppercase; letter-spacing: .14em; font-size: .8rem; font-weight: 400; }

/* ---------- Banner anteprima ---------- */

/* ---------- Header ---------- */
.site-header {
  position: sticky; top: var(--banner-h); z-index: 50; height: var(--header-h);

.brand { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 1.35rem; letter-spacing: var(--display-tracking); text-decoration: none; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
[data-tema="elegante"] .brand { font-size: 1.6rem; }

/* ---------- Hero ---------- */
.hero { position: relative; isolation: isolate; }
.hero__media img { width: 100%; height: 100%; object-fit: cover; }
.hero h1 { font-size: clamp(3rem, 11vw, 7.5rem); }

.hero__content { display: grid; gap: 1.25rem; justify-items: start; }

/* Elegante: foto a tutto schermo, testo centrato */
[data-tema="elegante"] .hero { min-height: max(34rem, calc(100svh - var(--banner-h) - var(--header-h))); display: grid; color: var(--on-dark); background: var(--dark); }
[data-tema="elegante"] .hero__inner { display: grid; align-items: end; padding-block: 5rem clamp(3rem, 8vw, 5.5rem); }
[data-tema="elegante"] .hero__media { position: absolute; inset: 0; z-index: -1; }
[data-tema="elegante"] .hero__media::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(18,14,11,.9) 0%, rgba(18,14,11,.55) 45%, rgba(18,14,11,.25) 100%); }
[data-tema="elegante"] .hero__content { justify-items: center; text-align: center; margin-inline: auto; }
[data-tema="elegante"] .hero .eyebrow { color: var(--accent-on-dark); }

[data-tema="elegante"] .hero .btn--primary { background: var(--on-dark); color: var(--dark); }
[data-tema="elegante"] .hero .btn--primary:hover { background: var(--accent-on-dark); }
[data-tema="elegante"] .hero .btn--ghost:hover { background: var(--on-dark); color: var(--dark); border-color: var(--on-dark); }

/* Moderno: blocco scuro diviso, tipografia enorme */
[data-tema="moderno"] .hero { background: var(--dark); color: var(--on-dark); }
[data-tema="moderno"] .hero__inner { display: grid; }
[data-tema="moderno"] .hero__media { order: -1; height: 34svh; min-height: 14rem; margin-inline: -1rem; }
[data-tema="moderno"] .hero__content { padding-block: 2.5rem 3.5rem; }
[data-tema="moderno"] .hero .eyebrow { color: var(--accent-on-dark); }

[data-tema="moderno"] .hero h1 { text-transform: uppercase; font-size: clamp(2.4rem, 11vw, 6rem); line-height: .92; overflow-wrap: break-word; hyphens: auto; }

@media (min-width: 860px) {

  [data-tema="moderno"] .hero h1 { font-size: clamp(3rem, 6.4vw, 6.25rem); }
}

/* Naturale: testo e foto ad arco su fondo crema */
[data-tema="naturale"] .hero { padding-block: clamp(2.5rem, 7vw, 5rem) clamp(3.5rem, 8vw, 6rem); overflow: hidden; }
[data-tema="naturale"] .hero__inner { display: grid; gap: 2.75rem; align-items: center; }
[data-tema="naturale"] .hero h1 { font-weight: 350; font-size: clamp(3rem, 10vw, 6.5rem); font-variation-settings: "SOFT" 100, "opsz" 144; }

[data-tema="naturale"] .hero__media picture { display: block; aspect-ratio: 4 / 5; border-radius: 999px 999px var(--radius) var(--radius); overflow: hidden; }

  [data-tema="naturale"] .hero__inner { grid-template-columns: 1.1fr .9fr; gap: 4rem; }
  [data-tema="naturale"] .hero__media { justify-self: end; }
}

/* Striscia scorrevole (solo moderno) */
.ticker { display: none; }
[data-tema="moderno"] .ticker { display: block; overflow: hidden; background: var(--accent); color: var(--accent-ink); padding-block: .9rem; }
.ticker__track { display: flex; width: max-content; gap: 2.5rem; font: 700 1.05rem/1 var(--font-display); text-transform: uppercase; letter-spacing: -.01em; }

@keyframes ticker { to { transform: translateX(-50%); } }

/* ---------- Chi siamo ---------- */
.about__grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(2.5rem, 6vw, 5rem); align-items: center; }
.about__media { position: relative; max-width: 28rem; }
.about__media img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: var(--radius); }

[data-tema="elegante"] .about__media { margin-right: 1.25rem; }
[data-tema="moderno"] .about__media::before { content: ""; position: absolute; inset: auto auto -1rem -1rem; width: 55%; height: 55%; background: var(--accent); z-index: -1; border-radius: var(--radius); }
[data-tema="moderno"] .about { isolation: isolate; }
[data-tema="moderno"] .about__text h2 { text-transform: uppercase; }
[data-tema="naturale"] .about__media img { border-radius: var(--radius) 160px var(--radius) var(--radius); }
@media (min-width: 860px) {

/* ---------- Servizi ---------- */
.services { background: var(--surface); }
[data-tema="moderno"] .services { background: var(--bg); }
.services__list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); column-gap: 4.5rem; counter-reset: srv; }
@media (min-width: 860px) { .services__list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.service { padding-block: 1.4rem; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr); gap: .4rem; counter-increment: srv; }
.service__head { display: flex; align-items: baseline; gap: .75rem; }
.service h3 { font-size: 1.3rem; line-height: 1.2; min-width: 0; overflow-wrap: break-word; hyphens: auto; }

.service__book { justify-self: start; display: inline-flex; align-items: center; gap: .4rem; margin-top: .2rem; font-size: .85rem; font-weight: 500; color: var(--accent-text); text-decoration: none; }

[data-tema="moderno"] .services__list { gap: .75rem; }
[data-tema="moderno"] .service { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.5rem; position: relative; }
[data-tema="moderno"] .service::before { content: counter(srv, decimal-leading-zero); font: 700 .8rem/1 var(--font-display); color: var(--accent-text); margin-bottom: .5rem; }
[data-tema="moderno"] .service { container-type: inline-size; }
[data-tema="moderno"] .service h3 { text-transform: uppercase; font-size: clamp(.8rem, 5.2cqi, 1.15rem); letter-spacing: -.01em; flex: 1 1 12rem; }

    document.querySelectorAll('.reveal').forEach(function (el) { io.observe(el); });
  }
})();
</script>
</body>
