<script>
/* Legge tipo e tema prima del rendering: imposta gli attributi, carica i font giusti e precarica l'immagine hero. */
(function () {
  var d = {};
  try { d = JSON.parse(document.getElementById('dati').textContent); } catch (e) {}
  if (!d || typeof d !== 'object') d = {};
  var temaDefault = { idraulico: 'elegante', elettricista: 'moderno', meccanico: 'moderno', carrozzeria: 'moderno', falegname: 'naturale', imbianchino: 'naturale', fabbro: 'elegante' };
  var tipo = temaDefault[d.tipo] ? d.tipo : 'idraulico';
  var tema = { elegante: 1, moderno: 1, naturale: 1 }[d.tema] ? d.tema : temaDefault[tipo];
  // Percorso assoluto delle immagini: funziona anche quando la pagina viene copiata in /demo/<nome-attivita>/.
  var ASSETS = '/demo/templates/artigiani/assets/';
  var root = document.documentElement;
  root.setAttribute('data-assets', ASSETS);
  root.setAttribute('data-tipo', tipo);
  root.setAttribute('data-tema', tema);

  var corpo = '&family=Lexend:wght@400;700';
  var font = {
    elegante: 'family=Source+Serif+4:opsz,wght@8..60,500..700' + corpo,
    moderno: 'family=Archivo:wght@600..900' + corpo,
    naturale: 'family=Bitter:wght@500..800' + corpo
  };
  var link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://fonts.googleapis.com/css2?' + font[tema] + '&display=swap';
  document.head.appendChild(link);

  [['(max-width: 759px)', 'hero-800'], ['(min-width: 760px)', 'hero-1600']].forEach(function (p) {
    var l = document.createElement('link');
    l.rel = 'preload'; l.as = 'image'; l.media = p[0];
    l.href = ASSETS + tipo + '/' + p[1] + '.webp';
    document.head.appendChild(l);
  });
})();
</script>

<style>
/* ---------- Temi (contrasto alto: testo ≥ 7:1 sullo sfondo) ---------- */
:root {
  --banner-h: 44px;
  --header-h: 68px;
  --maxw: 72rem;
  --wa: #1d7a43; --wa-hover: #145c31;
  --urgent: #b3261e;
  --open: #1e7d3f;
  --closed: #b3261e;
  --font-body: "Lexend", Verdana, system-ui, sans-serif;
}
[data-tema="elegante"] {
  --bg: #f8f6f1; --surface: #ece7dc; --ink: #101a2c; --muted: #39435a; --line: #c9c1af;
  --accent: #1d3a6b; --accent-text: #1d3a6b; --accent-ink: #ffffff; --accent-on-dark: #f2c879;
  --dark: #0f1d36; --on-dark: #ffffff; --on-dark-muted: #d0d7e4;
  --font-display: "Source Serif 4", Georgia, serif;
  --display-weight: 650; --display-tracking: -0.015em;
  --radius: 6px;
}
[data-tema="moderno"] {
  --bg: #ffffff; --surface: #f1f1ee; --ink: #0d0d0d; --muted: #383838; --line: #c8c8c4;
  --accent: #ffc400; --accent-text: #0d0d0d; --accent-ink: #0d0d0d; --accent-on-dark: #ffc400;
  --dark: #0d0d0d; --on-dark: #ffffff; --on-dark-muted: #d4d4d4;
  --font-display: "Archivo", "Arial Black", system-ui, sans-serif;
  --display-weight: 850; --display-tracking: -0.03em;
  --radius: 4px;
}
[data-tema="naturale"] {
  --bg: #f6f1e7; --surface: #ebe2d1; --ink: #211d16; --muted: #463f33; --line: #cdbfa6;
  --accent: #7a3b1e; --accent-text: #7a3b1e; --accent-ink: #ffffff; --accent-on-dark: #e8c27a;
  --dark: #262119; --on-dark: #f6f1e7; --on-dark-muted: #d6cdbb;
  --font-display: "Bitter", Georgia, serif;
  --display-weight: 700; --display-tracking: -0.01em;
  --radius: 16px;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--banner-h) + var(--header-h) + 8px); -webkit-text-size-adjust: 100%; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body {
  margin: 0; padding-top: var(--banner-h);
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 1.1875rem; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body.has-callbar { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
@media (min-width: 900px) { body.has-callbar { padding-bottom: 0; } }
img { display: block; max-width: 100%; height: auto; }
a { color: inherit; }
h1, h2, h3 {
  margin: 0; font-family: var(--font-display); font-weight: var(--display-weight);
  letter-spacing: var(--display-tracking); line-height: 1.1; text-wrap: balance;
  overflow-wrap: break-word; hyphens: auto;
}
p { margin: 0; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.dark :focus-visible, [data-tema="elegante"] .hero :focus-visible { outline-color: var(--on-dark); }
.wrap { width: min(100% - 2rem, var(--maxw)); margin-inline: auto; }
.skip { position: absolute; left: 1rem; top: -100px; z-index: 100; background: var(--ink); color: var(--bg); padding: .6rem 1rem; }
.skip:focus { top: calc(var(--banner-h) + .5rem); }
.icon { width: 1.2em; height: 1.2em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.section { padding-block: clamp(3.5rem, 9vw, 6.5rem); }
.sec-head { display: grid; gap: .6rem; margin-bottom: clamp(2rem, 5vw, 3rem); max-width: 44rem; }
.sec-head h2 { font-size: clamp(2rem, 6vw, 3.25rem); }
.sec-head p:not(.label) { color: var(--muted); font-size: 1.15rem; }
.label { font-weight: 700; font-size: 1rem; color: var(--accent-text); }
[data-tema="moderno"] .label { display: inline-block; justify-self: start; background: var(--accent); color: var(--accent-ink); padding: .1rem .55rem; }
.dark .label { color: var(--accent-on-dark); }
[data-tema="moderno"] .dark .label { color: var(--accent-ink); }

/* ---------- Pulsanti (grandi, per tutti) ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .7rem;
  min-height: 60px; padding: .85rem 1.5rem; border: 2px solid transparent; border-radius: var(--radius);
  font: 700 1.15rem/1.2 var(--font-body); text-decoration: none; text-align: left; cursor: pointer;
  transition: background-color .2s, color .2s, border-color .2s;
}
.btn .icon { width: 1.4em; height: 1.4em; }
.btn__text { display: grid; }
.btn__sub { font-weight: 400; font-size: .92rem; opacity: .95; }
.btn--call { background: var(--accent); color: var(--accent-ink); }
.btn--call:hover { background: var(--ink); color: var(--bg); }
.btn--wa { background: var(--wa); color: #fff; }
.btn--wa:hover { background: var(--wa-hover); }
.btn--ghost { border-color: currentColor; background: transparent; }
.btn--ghost:hover { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn--small { min-height: 48px; padding: .5rem 1rem; font-size: 1rem; }
.dark .btn--call, [data-tema="elegante"] .hero .btn--call { background: var(--accent-on-dark); color: #111; }
.dark .btn--call:hover, [data-tema="elegante"] .hero .btn--call:hover { background: #fff; }
[data-tema="moderno"] .btn--call { border-color: var(--ink); }

/* ---------- Banner anteprima ---------- */
.preview-banner {
  position: fixed; inset: 0 0 auto 0; z-index: 60;
  background: #161616; color: #fff;
  font: 400 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: .6rem 1rem; text-align: center;
}
.preview-banner__tag {
  display: inline-block; margin-right: .5rem; padding: .1rem .45rem; border-radius: 3px;
  background: #ffd400; color: #111; font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase;
}
.preview-banner a { color: #ffd400; font-weight: 600; margin-left: .35rem; white-space: nowrap; text-underline-offset: 2px; }
.preview-banner a:focus-visible { outline-color: #ffd400; }

/* ---------- Header ---------- */
.site-header {
  position: sticky; top: var(--banner-h); z-index: 50; height: var(--header-h);
  background: var(--bg); border-bottom: 2px solid var(--line);
}
.site-header .wrap { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.brand { font-family: var(--font-display); font-weight: var(--display-weight); font-size: 1.3rem; letter-spacing: var(--display-tracking); text-decoration: none; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav { display: none; }
.nav ul { display: flex; gap: 1.5rem; list-style: none; margin: 0; padding: 0; }
.nav a { text-decoration: none; font-size: 1.02rem; color: var(--muted); }
.nav a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
@media (min-width: 1100px) { .nav { display: block; } }

/* ---------- Badge e stato ---------- */
.badges { display: flex; flex-wrap: wrap; gap: .6rem; }
.badge { display: inline-flex; align-items: center; gap: .45rem; padding: .4rem .85rem; border-radius: 999px; font-weight: 700; font-size: 1rem; border: 2px solid currentColor; }
.badge--urgent { background: var(--urgent); border-color: var(--urgent); color: #fff; }
.status { display: inline-flex; align-items: center; gap: .6rem; font-size: 1.05rem; font-weight: 700; }
.status__dot { width: .75rem; height: .75rem; border-radius: 50%; background: var(--closed); flex: none; }
.status.is-open .status__dot { background: var(--open); }
.dark .status.is-open .status__dot, [data-tema="elegante"] .hero .status.is-open .status__dot { background: #4cd07d; }
.dark .status__dot, [data-tema="elegante"] .hero .status__dot { background: #ff8a7a; }

/* ---------- Hero ---------- */
.hero { padding-block: clamp(2rem, 6vw, 4.5rem) clamp(3rem, 7vw, 5rem); }
.hero__inner { display: grid; grid-template-columns: minmax(0, 1fr); gap: 2.25rem; align-items: center; }
.hero__content { display: grid; gap: 1.25rem; justify-items: start; }
.hero__kicker { font-weight: 700; font-size: 1.1rem; color: var(--accent-text); }
.hero h1 { font-size: clamp(2.5rem, 9vw, 4.75rem); }

.hero__media { position: relative; }
.hero__media picture { display: block; border-radius: var(--radius); overflow: hidden; aspect-ratio: 4 / 3; }
.hero__media img { width: 100%; height: 100%; object-fit: cover; }
@media (min-width: 860px) {
  .hero__inner { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 4rem; }
  .hero__media picture { aspect-ratio: 4 / 5; }
}
[data-tema="elegante"] .hero { background: var(--dark); color: var(--on-dark); }
[data-tema="elegante"] .hero__kicker { color: var(--accent-on-dark); }
[data-tema="elegante"] .hero__media::before { content: ""; position: absolute; inset: .9rem -.9rem -.9rem .9rem; border: 2px solid var(--accent-on-dark); border-radius: var(--radius); }
[data-tema="elegante"] .hero__media { margin-right: .9rem; }
[data-tema="elegante"] .hero__media picture { position: relative; }
[data-tema="moderno"] .hero { border-bottom: 2px solid var(--ink); }
[data-tema="moderno"] .hero__kicker { display: inline-block; background: var(--accent); padding: .15rem .6rem; color: var(--accent-ink); }
[data-tema="moderno"] .hero h1 { font-size: clamp(2.6rem, 10vw, 5.25rem); line-height: 1; }
[data-tema="moderno"] .hero__media { margin: 0 0 1rem 1rem; }
[data-tema="moderno"] .hero__media::before { content: ""; position: absolute; inset: 1rem 1rem -1rem -1rem; background: var(--accent); border-radius: var(--radius); }
[data-tema="moderno"] .hero__media picture { position: relative; }
[data-tema="naturale"] .hero__media picture { border-radius: 28px; }
[data-tema="naturale"] .hero h1 { font-weight: 750; }

/* ---------- Chi siamo ---------- */
.about__grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(2rem, 6vw, 4rem); align-items: center; }
.about__media img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: var(--radius); }
.about__text { display: grid; gap: 1.25rem; }
.about__text h2 { font-size: clamp(2rem, 6vw, 3.25rem); }
.about__text .lead { font-size: 1.25rem; max-width: 38rem; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: 1rem 2rem; margin: .25rem 0 0; padding-top: 1.25rem; border-top: 2px solid var(--line); }
.facts dt { font-size: 1rem; color: var(--muted); }
.facts dd { margin: .15rem 0 0; font-weight: 700; font-size: 1.2rem; }
@media (min-width: 860px) {
  .about__grid { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
  .about__media img { aspect-ratio: 4 / 5; }
}

/* ---------- Servizi ---------- */
.services { background: var(--surface); }
.cards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); gap: 1rem; }
.card { display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: .7rem; padding: 1.5rem; background: var(--bg); border: 2px solid var(--line); border-radius: var(--radius); }
.card__icon { display: grid; place-items: center; width: 3.5rem; height: 3.5rem; border-radius: var(--radius); background: var(--accent); color: var(--accent-ink); }

[data-tema="moderno"] .card { border-color: var(--ink); }
.card h3 { font-size: 1.4rem; }
.card p { color: var(--muted); font-size: 1.08rem; }
.card__link { justify-self: start; display: inline-flex; align-items: center; gap: .4rem; margin-top: .25rem; min-height: 44px; font-weight: 700; font-size: 1.05rem; color: var(--accent-text); text-underline-offset: 4px; }
[data-tema="moderno"] .card__link { text-decoration-color: var(--accent); text-decoration-thickness: 3px; }

.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; counter-reset: step; }

.zones-sec { background: var(--surface); }
.zones { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: .65rem; }

.visit h2 { font-size: clamp(2rem, 5.5vw, 3rem); }
.visit__flags { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem 1.25rem; margin-bottom: 1.25rem; }
.hours { margin: 0; }
.hours__row { display: flex; justify-content: space-between; gap: 1rem; padding-block: 1rem; border-bottom: 2px solid var(--line); font-size: 1.15rem; }
.hours__row dt { font-weight: 700; display: flex; align-items: center; flex-wrap: wrap; gap: .6rem; }
.hours__row dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
.hours__row.is-today { background: var(--surface); margin-inline: -.75rem; padding-inline: .75rem; border-radius: var(--radius); }
.hours__badge { font-size: .85rem; font-weight: 700; padding: .1rem .55rem; border-radius: 999px; background: var(--ink); color: var(--bg); }
.map { display: grid; gap: 1.25rem; }
.map__frame { width: 100%; aspect-ratio: 4 / 3; border: 2px solid var(--line); border-radius: var(--radius); background: var(--surface); }

.map__address { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem 1.5rem; }
.map__address p { display: flex; gap: .6rem; align-items: flex-start; font-weight: 700; font-size: 1.15rem; }
.map__address .icon { margin-top: .2em; color: var(--accent-text); }

/* ---------- Contatti ---------- */
.contact__grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 3rem; }
@media (min-width: 900px) { .contact__grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
.contact h2 { font-size: clamp(2.2rem, 7vw, 3.75rem); }
.contact .lead { color: var(--on-dark-muted); margin-top: 1rem; font-size: 1.2rem; }
.contact__actions { display: grid; gap: .75rem; margin-top: 2rem; max-width: 30rem; }
.contact__actions .btn { justify-content: flex-start; }
.contact__list { list-style: none; margin: 0; padding: 0; }
.contact__list li { border-top: 1px solid rgba(255,255,255,.25); }
.contact__list li:last-child { border-bottom: 1px solid rgba(255,255,255,.25); }
.contact__item { display: flex; align-items: center; gap: 1rem; padding-block: 1.2rem; text-decoration: none; }
.contact__item .icon { color: var(--accent-on-dark); width: 1.5em; height: 1.5em; }
.contact__label { display: block; font-size: 1rem; color: var(--on-dark-muted); }
.contact__value { display: block; font-size: 1.25rem; font-weight: 700; overflow-wrap: anywhere; }
a.contact__item:hover .contact__value { text-decoration: underline; text-underline-offset: 4px; }

/* ---------- Footer ---------- */
.site-footer { padding-block: 2.5rem; border-top: 1px solid rgba(255,255,255,.15); font-size: 1rem; color: var(--on-dark-muted); }
.site-footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem 2rem; }
.site-footer strong { color: var(--on-dark); font-family: var(--font-display); font-size: 1.3rem; }
.dark { background: var(--dark); color: var(--on-dark); }

/* ---------- Barra di chiamata fissa (solo mobile) ---------- */
.callbar {
  position: fixed; inset: auto 0 0 0; z-index: 55;
  display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: .5rem;
  padding: .6rem 1rem calc(.6rem + env(safe-area-inset-bottom));
  background: var(--bg); border-top: 2px solid var(--ink); box-shadow: 0 -6px 18px rgba(0,0,0,.12);
}
.callbar.is-single { grid-template-columns: minmax(0, 1fr); }
.callbar .btn { min-height: 58px; padding-inline: .9rem; justify-content: center; font-size: 1.1rem; }
@media (min-width: 900px) { .callbar { display: none; } }

/* ---------- Errore dati ---------- */
.data-error { max-width: 36rem; margin: 6rem auto; padding: 2rem; border: 2px dashed var(--line); font-family: system-ui, sans-serif; }
</style>
</head>

    var blocchi = [];
    if (orari.length) {
      nav.push(['orari', 'Orari']);
      var flags = [badgeUrgenza(), badgeStato()].filter(Boolean);
      blocchi.push(h('div', { class: 'visit__hours', id: 'orari' },
        h('div', { class: 'sec-head', style: 'margin-bottom:1.25rem' }, h('p', { class: 'label' }, 'Quando'), h('h2', null, 'Orari')),
        flags.length && h('div', { class: 'visit__flags' }, flags),
        h('dl', { class: 'hours' }, orari.map(function (o) {
          var oggi = o.giorni.indexOf(ora.giorno) > -1;
          return h('div', { class: 'hours__row' + (oggi ? ' is-today' : '') },
            h('dt', null, o.giorno, oggi && h('span', { class: 'hours__badge' }, 'Oggi')),
            h('dd', null, o.orario || 'Chiuso'));
        }))));
    }
    if (indirizzo) {
      nav.push(['dove', 'Dove siamo']);
      var q = encodeURIComponent(indirizzo);
      blocchi.push(h('div', { class: 'map', id: 'dove' },
        h('div', { class: 'sec-head', style: 'margin-bottom:.75rem' }, h('p', { class: 'label' }, 'Dove'), h('h2', null, 'Dove siamo')),
        h('iframe', { class: 'map__frame', src: 'https://maps.google.com/maps?q=' + q + '&z=16&output=embed', title: 'Mappa: ' + indirizzo, loading: 'lazy', referrerpolicy: 'no-referrer-when-downgrade', allowfullscreen: true }),
        h('div', { class: 'map__address' },
          h('p', null, icon('pin'), indirizzo),
          h('a', { class: 'btn btn--ghost btn--small', href: 'https://www.google.com/maps/dir/?api=1&destination=' + q, target: '_blank', rel: 'noopener' }, 'Indicazioni stradali', icon('ext')))));
    }
    visit = h('section', { class: 'section visit', 'aria-label': 'Orari e posizione' },
      h('div', { class: 'wrap visit__grid' + (blocchi.length > 1 ? ' has-both' : '') }, blocchi));
  }

  // Contatti
  var contatti = [];
  if (telefono) contatti.push(['phone', 'Telefono', telefono, telHref && 'tel:' + telHref]);
  if (wa) contatti.push(['chat', 'WhatsApp', '+' + wa.replace(/^(\d{2})(\d{3})(\d+)/, '$1 $2 $3'), waLink(msgPreventivo())]);
  if (email) contatti.push(['mail', 'Email', email, 'mailto:' + email]);
  if (indirizzo) contatti.push(['pin', 'Indirizzo', indirizzo, 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(indirizzo)]);

  var contact = null;
  if (contatti.length) {
    nav.push(['contatti', 'Contatti']);
    contact = h('section', { class: 'section contact dark', id: 'contatti', 'aria-labelledby': 'contact-title' },
      h('div', { class: 'wrap contact__grid' },
        h('div', null,
          h('p', { class: 'label' }, 'Contatti'),
          h('h2', { id: 'contact-title' }, 'Richiedi un preventivo'),
          h('p', { class: 'lead' }, wa
            ? 'Chiama oppure scrivi su WhatsApp: indica il tipo di lavoro e l\'indirizzo e, se puoi, manda una foto del problema.'
            : 'Chiama e spiegaci di cosa hai bisogno.'),
          (telHref || wa) && h('div', { class: 'contact__actions' }, btnChiama(), btnWa())),
        h('ul', { class: 'contact__list' }, contatti.map(function (c) {
          var inner = [icon(c[0]), h('span', null, h('span', { class: 'contact__label' }, c[1]), h('span', { class: 'contact__value' }, c[2]))];
          var ext = c[3] && /^https/.test(c[3]);
          return h('li', null, c[3]
            ? h('a', { class: 'contact__item', href: c[3], target: ext ? '_blank' : null, rel: ext ? 'noopener' : null }, inner)
            : h('div', { class: 'contact__item' }, inner));
        }))));
  }

  // Header: numero sempre a portata di mano
  var headerCta = telHref
    ? h('a', { class: 'btn btn--call btn--small', href: 'tel:' + telHref }, icon('phone'), h('span', null, 'Chiama'))
    : wa ? h('a', { class: 'btn btn--wa btn--small', href: waLink(msgPreventivo()), target: '_blank', rel: 'noopener' }, icon('chat'), 'Preventivo') : null;
  var header = h('header', { class: 'site-header' },
    h('div', { class: 'wrap' },
      h('a', { class: 'brand', href: '#contenuto' }, nome),
      h('nav', { class: 'nav', 'aria-label': 'Sezioni' },
        h('ul', null, nav.map(function (n) { return h('li', null, h('a', { href: '#' + n[0] }, n[1])); }))),
      headerCta));

  // Footer
  var footer = h('footer', { class: 'site-footer dark' },
    h('div', { class: 'wrap' },
      h('div', null, h('strong', null, nome), indirizzo && h('div', null, indirizzo)),
      h('div', null,
        h('div', null, '© ' + new Date().getFullYear() + ' ' + nome),
        h('div', null, 'Anteprima dimostrativa, non è il sito ufficiale dell\'attività.'),
        h('div', null, 'Realizzata da Flavio Visconti · ',
          h('a', { href: 'mailto:' + AUTORE_EMAIL + '?subject=' + encodeURIComponent('Sito per ' + nome) }, AUTORE_EMAIL)))));

  // Barra fissa in basso su mobile: chiamata sempre visibile
  var callbar = null;
  if (telHref || wa) {
    var chiama = telHref && h('a', { class: 'btn btn--call', href: 'tel:' + telHref }, icon('phone'), 'Chiama ora');
    var scrivi = wa && h('a', { class: 'btn btn--wa', href: waLink(msgPreventivo()), target: '_blank', rel: 'noopener', 'aria-label': 'Richiedi un preventivo su WhatsApp' }, icon('chat'), 'WhatsApp');
    callbar = h('nav', { class: 'callbar' + (chiama && scrivi ? '' : ' is-single'), 'aria-label': 'Contatto rapido' }, chiama, scrivi);
    document.body.classList.add('has-callbar');
  }

  var main = h('main', { id: 'contenuto', tabindex: '-1' }, hero, services, steps, about, zonesSec, visit, contact);
  app.append(header, main, footer);
  if (callbar) document.body.append(callbar);

  /* ===== Altezza del banner (può andare su due righe) ===== */
  var banner = document.getElementById('preview-banner');
  function syncBanner() { root.style.setProperty('--banner-h', banner.offsetHeight + 'px'); }
  syncBanner();
  if ('ResizeObserver' in window) new ResizeObserver(syncBanner).observe(banner);
})();
</script>
</body>
</html>
